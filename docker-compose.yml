name: e-commerce-microservice-shop

services:
  consul:
    image: hashicorp/consul:1.22
    container_name: consul
    command: ["agent", "-dev", "-client=0.0.0.0", "-ui"]
    ports:
      - "8500:8500" # HTTP API + Web UI
      - "8600:8600/tcp" # DNS
      - "8600:8600/udp"
    networks:
      - shop

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - shop


  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    environment:
      # Single node in KRaft mode (no ZooKeeper): broker + controller.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "29092:29092" # for clients on the host (e.g. services started from the IDE)
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
    networks:
      - shop

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    environment:
      KAFKA_CLUSTERS_0_NAME: shop
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8090:8080"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - shop

  auth-service:
    build:
      context: ./auth_service
    env_file:
      - ./auth_service/.env
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_started
    networks:
      - shop

  catalog-service:
    build:
      context: ./catalog_service
    env_file:
      - ./catalog_service/.env
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_started
    networks:
      - shop

  order-service:
    build:
      context: ./order_service
    env_file:
      - ./order_service/.env
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      consul:
        condition: service_started
    networks:
      - shop

  payment-service:
    build:
      context: ./payment_service
    env_file:
      - ./payment_service/.env
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      consul:
        condition: service_started
    networks:
      - shop

  notification-service:
    build:
      context: ./notification_service
    env_file:
      - ./notification_service/.env
    depends_on:
      kafka:
        condition: service_healthy
      consul:
        condition: service_started
    networks:
      - shop

  graphql-gateway:
    build:
      context: ./graphql_gateway
    environment:
      APP_ENV: development
      HTTP_ADDR: ":4000"
      ORDER_SERVICE_URL: http://order-service:8082
      CATALOG_SERVICE_URL: http://catalog-service:8081
    ports:
      - "4000:4000"
    depends_on:
      - order-service
      - catalog-service
    networks:
      - shop

  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - consul
      - auth-service
      - catalog-service
      - order-service
      - payment-service
      - notification-service
      - graphql-gateway
    networks:
      - shop

networks:
  shop:
    driver: bridge