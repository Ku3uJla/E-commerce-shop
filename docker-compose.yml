name: e-commerce-microservice-shop

services:
  consul:
    image: hashicorp/consul:1.22
    container_name: consul
    command: ["agent", "-dev", "-client=0.0.0.0", "-ui"]
    ports:
      - "8500:8500" # HTTP API + Web UI
      - "8600:8600/tcp" # DNS
      - "8600:8600/udp"
    networks:
      - shop

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - shop


  auth-service:
    build:
      context: ./auth_service
    env_file:
      - ./auth_service/.env
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_started
    networks:
      - shop

  catalog-service:
    build:
      context: ./catalog_service
    env_file:
      - ./catalog_service/.env
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_started
    networks:
      - shop

  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - consul
      - auth-service
      - catalog-service
    networks:
      - shop

networks:
  shop:
    driver: bridge