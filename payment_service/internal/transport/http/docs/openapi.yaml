openapi: 3.1.0
info:
  title: Payment Service API
  version: 1.0.0
  description: >
    Payments are created asynchronously by the order saga: the service consumes
    `OrderCreated` / `OrderCancelled` from Kafka topic `order.events` and publishes
    `PaymentCompleted` / `PaymentFailed` / `PaymentRefunded` to `payment.events`.
    The HTTP API is read-only.
servers:
  - url: /
paths:
  /api/payments:
    get:
      tags: [payments]
      summary: Get the payment of an order
      operationId: getPaymentByOrder
      parameters:
        - name: orderId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The payment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
        "400":
          description: Missing orderId
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No payment for this order (yet)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
components:
  schemas:
    Payment:
      type: object
      required: [id, orderId, userId, amount, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        amount: { type: integer, format: int64, description: Amount in cents }
        status: { type: string, enum: [COMPLETED, FAILED, REFUNDED] }
        reason: { type: string, description: Why the payment failed or was refunded }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
