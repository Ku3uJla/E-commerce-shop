user  nginx;
worker_processes  auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    resolver          consul:8600 valid=5s ipv6=off;
    resolver_timeout  3s;

    upstream auth_service {
        zone auth_service 64k;
        server auth-service.service.consul:8080 resolve;
    }

    upstream catalog_service {
        zone catalog_service 64k;
        server catalog-service.service.consul:8080 resolve;
    }

    server {
        listen      80;
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 7s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        proxy_next_upstream error timeout http_502 http_503 http_504;

        add_header X-Upstream-Addr $upstream_addr always;

        location = /healthz {
            default_type application/json;
            return 200 '{"status":"ok","gateway":"nginx"}';
        }

        # Auth service: /api/v1/auth/*
        location /api/v1/auth/ {
            proxy_pass http://auth_service;
        }

        # Catalog service: /api/v1/products*
        location /api/v1/products {
            proxy_pass http://catalog_service;
        }

        location / {
            default_type application/json;
            return 404 '{"error":"not found"}';
        }
    }
}