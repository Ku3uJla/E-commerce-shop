user  nginx;
worker_processes  auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    resolver          consul:8600 valid=5s ipv6=off;
    resolver_timeout  3s;

    upstream auth_service {
        zone auth_service 64k;
        server auth-service.service.consul:8080 resolve;
    }

    upstream catalog_service {
        zone catalog_service 64k;
        server catalog-service.service.consul:8081 resolve;
    }

    upstream order_service {
        zone order_service 64k;
        server order-service.service.consul:8082 resolve;
    }

    upstream payment_service {
        zone payment_service 64k;
        server payment-service.service.consul:8083 resolve;
    }

    upstream notification_service {
        zone notification_service 64k;
        server notification-service.service.consul:8084 resolve;
    }

    # Resolved once at startup via Docker DNS (not registered in Consul).
    upstream graphql_gateway {
        server graphql-gateway:4000;
    }

    server {
        listen      80;
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 7s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        proxy_next_upstream error timeout http_502 http_503 http_504;

        add_header X-Upstream-Addr $upstream_addr always;

        location = /healthz {
            default_type application/json;
            return 200 '{"status":"ok","gateway":"nginx"}';
        }

        # Auth service: /api/auth/* (legacy /api/v1/auth/*)
        location /api/auth/ {
            proxy_pass http://auth_service;
        }
        location /api/v1/auth/ {
            proxy_pass http://auth_service;
        }

        # Catalog service: /api/catalog/products* (legacy /api/v1/products*)
        location /api/catalog/ {
            proxy_pass http://catalog_service;
        }
        location /api/v1/products {
            proxy_pass http://catalog_service;
        }

        # Order service: /api/orders*
        location /api/orders {
            proxy_pass http://order_service;
        }

        # Payment service (read-only): /api/payments*
        location /api/payments {
            proxy_pass http://payment_service;
        }

        # Notification service: /api/notifications*
        location /api/notifications {
            proxy_pass http://notification_service;
        }

        # GraphQL gateway + Apollo Sandbox
        location /graphql {
            proxy_pass http://graphql_gateway;
        }

        # Swagger UI of each service: /docs/<service>/api-docs
        location /docs/auth/ {
            proxy_pass http://auth_service/;
        }
        location /docs/catalog/ {
            proxy_pass http://catalog_service/;
        }
        location /docs/orders/ {
            proxy_pass http://order_service/;
        }
        location /docs/payments/ {
            proxy_pass http://payment_service/;
        }
        location /docs/notifications/ {
            proxy_pass http://notification_service/;
        }

        location / {
            default_type application/json;
            return 404 '{"error":"not found"}';
        }
    }
}